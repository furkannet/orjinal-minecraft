<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Orijinal Minecraft - Köyler, Yaratıklar & Envanter</title>
<style>
:root{--ink:#f6f1e7;--mut:#a9b2bf;--mc-green:#55ff55;--mc-gold:#ffaa00;--mc-blue:#55ffff;--panel:rgba(20,20,24,.84);--line:rgba(255,255,255,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}

/* Crosshair */
#crosshair{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:20px;height:20px;pointer-events:none;z-index:10}
#crosshair::before,#crosshair::after{content:'';position:absolute;background:rgba(255,255,255,.85);box-shadow:0 0 2px rgba(0,0,0,.8)}
#crosshair::before{top:9px;left:0;width:20px;height:2px}
#crosshair::after{top:0;left:9px;width:2px;height:20px}

/* HUD Panel */
#hud{position:fixed;top:8px;left:8px;display:flex;flex-direction:column;gap:3px;font-size:11px;font-family:monospace;background:var(--panel);padding:6px 10px;border-radius:8px;border:1px solid var(--line);z-index:10;pointer-events:none}
#hud b{color:var(--mc-green)}

/* Top Right Controls */
#topRight{position:fixed;top:8px;right:8px;display:flex;gap:6px;z-index:12}
.hudBtn{font-family:inherit;font-size:11px;font-weight:700;background:var(--panel);color:var(--ink);border:1px solid var(--line);padding:5px 9px;border-radius:7px;cursor:pointer;backdrop-filter:blur(4px);pointer-events:auto}
.hudBtn:active{transform:scale(.95)}
#modeBtn{color:var(--mc-gold);border-color:var(--mc-gold)}
#invToggleBtn{background:#1e3a52;border-color:var(--mc-blue);color:#fff}

/* Hearts & Hunger */
#statusBars{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);display:flex;justify-content:space-between;width:min(320px,90vw);font-size:14px;pointer-events:none;z-index:10;text-shadow:0 1px 3px #000}

/* Hotbar */
#hotbar{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);display:flex;background:rgba(0,0,0,.68);padding:3px;border-radius:6px;border:2px solid #555;gap:3px;z-index:10}
.slot{width:38px;height:38px;background:rgba(255,255,255,.1);border:2px solid #333;border-radius:4px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:all .1s}
.slot.active{border-color:#fff;background:rgba(255,255,255,.3);transform:scale(1.08)}
.slot canvas{width:28px;height:28px;image-rendering:pixelated}
.slot .num{position:absolute;bottom:1px;right:3px;font-size:9px;font-family:monospace;font-weight:700;color:#fff;text-shadow:1px 1px 0 #000}

/* Mobile Controls */
#mobileControls{position:fixed;inset:0;pointer-events:none;z-index:15}
.touchBtn{position:absolute;pointer-events:auto;background:rgba(30,30,35,.75);border:2px solid rgba(255,255,255,.3);color:#fff;font-weight:700;font-size:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none}
.touchBtn:active{background:rgba(255,255,255,.35);transform:scale(.94)}
#dpad{position:absolute;bottom:20px;left:20px;width:120px;height:120px;pointer-events:auto}
#btnUp{top:0;left:40px;width:40px;height:40px;border-radius:10px}
#btnDown{bottom:0;left:40px;width:40px;height:40px;border-radius:10px}
#btnLeft{top:40px;left:0;width:40px;height:40px;border-radius:10px}
#btnRight{top:40px;right:0;width:40px;height:40px;border-radius:10px}

#actBtns{position:absolute;bottom:20px;right:20px;display:flex;flex-direction:column;gap:10px;align-items:flex-end}
#btnJump{width:56px;height:56px;background:#2563eb;border-color:#93c5fd}
.actRow{display:flex;gap:10px}
#btnMine{width:52px;height:52px;background:#dc2626;border-color:#fca5a5}
#btnPlace{width:52px;height:52px;background:#16a34a;border-color:#86efac}

/* Envanter Modal (X Tuşu) */
#invModal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:none;align-items:center;justify-content:center;z-index:30;padding:12px;backdrop-filter:blur(5px)}
#invCard{background:#181c24;border:2px solid #555;border-radius:12px;width:min(440px,94vw);max-height:85vh;overflow:auto;padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.8)}
#invCard h3{margin:0 0 10px;font-size:15px;display:flex;justify-content:space-between;align-items:center;color:var(--mc-gold)}
#invGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:6px;margin-bottom:12px}
.invItem{width:46px;height:46px;background:rgba(255,255,255,.08);border:2px solid #333;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative}
.invItem:hover,.invItem:active{border-color:var(--mc-green);background:rgba(255,255,255,.2);transform:scale(1.05)}
.invItem canvas{width:30px;height:30px;image-rendering:pixelated}
.invItem span{font-size:8px;color:#aaa;text-overflow:ellipsis;white-space:nowrap;overflow:hidden;max-width:42px;margin-top:2px}
.closeBtn{background:#dc2626;color:#fff;border:none;padding:4px 10px;border-radius:6px;cursor:pointer;font-weight:700}

/* Toast message */
#toast{position:fixed;top:20%;left:50%;transform:translateX(-50%);background:rgba(0,0,0,.85);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .25s;z-index:40;border:1px solid #555}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="crosshair"></div>

<div id="hud">
  <div><b>FPS:</b> <span id="fps">60</span></div>
  <div><b>Mod:</b> <span id="modeText" style="color:var(--mc-gold)">Hayatta Kalma</span></div>
  <div><b>XYZ:</b> <span id="coords">0, 0, 0</span></div>
  <div><b>Chunk:</b> <span id="chunkVal">0, 0</span></div>
  <div><b>Seed:</b> <span id="seedVal">0</span></div>
  <div><b>Seçili:</b> <span id="blockName">Çim</span></div>
</div>

<div id="topRight">
  <button id="modeBtn" class="hudBtn">🎮 Mod (M)</button>
  <button id="invToggleBtn" class="hudBtn">🎒 Envanter (X)</button>
</div>

<div id="statusBars">
  <div id="hearts">❤️❤️❤️❤️❤️</div>
  <div id="hunger">🍗🍗🍗🍗🍗</div>
</div>

<div id="hotbar"></div>

<div id="mobileControls">
  <div id="dpad">
    <div id="btnUp" class="touchBtn">▲</div>
    <div id="btnLeft" class="touchBtn">◀</div>
    <div id="btnRight" class="touchBtn">▶</div>
    <div id="btnDown" class="touchBtn">▼</div>
  </div>
  <div id="actBtns">
    <div class="actRow">
      <div id="btnMine" class="touchBtn">⛏️ KIR</div>
      <div id="btnPlace" class="touchBtn">🧱 KOY</div>
    </div>
    <div id="btnJump" class="touchBtn">⬆️ ZIPLA</div>
  </div>
</div>

<!-- Envanter Penceresi -->
<div id="invModal">
  <div id="invCard">
    <h3>
      <span>🎒 Blok Envanteri (Seç & Slota Koy)</span>
      <button class="closeBtn" onclick="toggleInventory(false)">✕</button>
    </h3>
    <div id="invGrid"></div>
    <p style="margin:0;font-size:11px;color:var(--mut);text-align:center">Tıkladığın blok mevcut slota yerleşir. 'X' veya 'M' tuşunu kullanabilirsin.</p>
  </div>
</div>

<div id="toast"></div>

<script src="three.min.js"></script>
<script>
const APP_VERSION = 'v0.1.3';
function $(id){ return document.getElementById(id); }

function toast(msg){
  const t = $('toast');
  t.textContent = msg;
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => { t.style.opacity = '0'; }, 1800);
}

/* ================= SES SİSTEMİ ================= */
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function getAudio(){
  if(!audioCtx) audioCtx = new AudioContext();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
function playSound(type){
  try {
    const ctx = getAudio();
    const t = ctx.currentTime;
    if(type === 'break'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.exponentialRampToValueAtTime(40, t + 0.12);
      gain.gain.setValueAtTime(0.3, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.12);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.12);
    } else if(type === 'place'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(220, t);
      osc.frequency.exponentialRampToValueAtTime(110, t + 0.08);
      gain.gain.setValueAtTime(0.4, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.08);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.08);
    } else if(type === 'jump'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, t);
      osc.frequency.exponentialRampToValueAtTime(320, t + 0.1);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.1);
    } else if(type === 'villager'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(140, t);
      osc.frequency.setValueAtTime(110, t + 0.15);
      gain.gain.setValueAtTime(0.2, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.35);
    } else if(type === 'zombie'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(80, t);
      osc.frequency.linearRampToValueAtTime(60, t + 0.3);
      gain.gain.setValueAtTime(0.25, t);
      gain.gain.exponentialRampToValueAtTime(0.01, t + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t); osc.stop(t + 0.3);
    }
  } catch(e){}
}

/* ================= 16x16 PİKSEL DOKU ÜRETECİ ================= */
function makePixelTexture(fn){
  const cv = document.createElement('canvas');
  cv.width = 16; cv.height = 16;
  const cx = cv.getContext('2d');
  fn(cx);
  const tex = new THREE.CanvasTexture(cv);
  tex.magFilter = THREE.NearestFilter;
  tex.minFilter = THREE.NearestFilter;
  return { tex, canvas: cv };
}

function rgb(r, g, b){ return `rgb(${r},${g},${b})`; }
function noise(val, spread){ return Math.min(255, Math.max(0, val + (Math.random() * spread * 2 - spread) | 0)); }

const TEXTURES = {};
function initTextures(){
  TEXTURES.grass_top = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      cx.fillStyle = rgb(noise(80, 20), noise(160, 25), noise(35, 15));
      cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.grass_side = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const grassH = 3 + ((x % 3 === 0) ? 2 : 0) + ((x % 5 === 0) ? 1 : 0);
      if(y < grassH) cx.fillStyle = rgb(noise(80, 20), noise(160, 25), noise(35, 15));
      else { const br = noise(130, 20); cx.fillStyle = rgb(br, (br*0.65)|0, (br*0.4)|0); }
      cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.dirt = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const br = noise(130, 20); cx.fillStyle = rgb(br, (br*0.65)|0, (br*0.4)|0); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.stone = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const gr = noise(128, 22); cx.fillStyle = rgb(gr, gr, gr); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.cobble = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const edge = (x === 0 || y === 0 || (x+y)%5 === 0);
      const gr = edge ? noise(70, 15) : noise(135, 25);
      cx.fillStyle = rgb(gr, gr, gr); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.wood_side = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const stripe = (x % 4 === 0) ? -25 : 0;
      const br = noise(105 + stripe, 15);
      cx.fillStyle = rgb(br, (br*0.65)|0, (br*0.35)|0); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.wood_top = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const dist = Math.hypot(x - 7.5, y - 7.5);
      const br = noise(160 + (((dist|0)%2===0)?-20:15), 15);
      cx.fillStyle = rgb(br, (br*0.75)|0, (br*0.5)|0); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.planks = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const border = (y % 4 === 0 || (y < 4 && x === 8) || (y >= 4 && y < 8 && x === 3) || (y >= 8 && y < 12 && x === 12) || (y >= 12 && x === 6));
      const br = border ? noise(120, 10) : noise(180, 18);
      cx.fillStyle = rgb(br, (br*0.7)|0, (br*0.4)|0); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.leaves = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      cx.fillStyle = rgb(noise(35, 15), noise(130, 30), noise(35, 15)); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.sand = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const yl = noise(215, 20); cx.fillStyle = rgb(yl, (yl*0.9)|0, (yl*0.65)|0); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.glass = makePixelTexture(cx => {
    cx.fillStyle = 'rgba(210, 240, 255, 0.25)'; cx.fillRect(0, 0, 16, 16);
    cx.fillStyle = 'rgba(255, 255, 255, 0.9)'; cx.strokeRect(0.5, 0.5, 15, 15);
    cx.fillRect(2, 2, 3, 1); cx.fillRect(2, 3, 1, 2);
  });
  TEXTURES.brick = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const mortar = (y % 4 === 0 || (y < 4 && x === 8) || (y >= 4 && y < 8 && x === 0) || (y >= 8 && y < 12 && x === 8) || (y >= 12 && x === 0));
      if(mortar) cx.fillStyle = '#bbb';
      else { const r = noise(170, 20); cx.fillStyle = rgb(r, (r*0.4)|0, (r*0.35)|0); }
      cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.diamond_ore = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const isGem = ((x===3&&y===4)||(x===4&&y===4)||(x===4&&y===5)||(x===10&&y===9)||(x===11&&y===9)||(x===11&&y===10)||(x===7&&y===12));
      cx.fillStyle = isGem ? '#22ffff' : rgb(noise(128, 20), noise(128, 20), noise(128, 20));
      cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.tnt_side = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      cx.fillStyle = (y >= 5 && y <= 10) ? '#fff' : rgb(noise(210, 20), 20, 20);
      cx.fillRect(x, y, 1, 1);
    }
    cx.fillStyle = '#000'; cx.font = 'bold 6px monospace'; cx.fillText('TNT', 2, 10);
  });
  TEXTURES.tnt_top = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      cx.fillStyle = rgb(noise(190, 20), 20, 20); cx.fillRect(x, y, 1, 1);
    }
    cx.fillStyle = '#444'; cx.fillRect(6, 6, 4, 4);
  });
  // Deniz suyu (Water)
  TEXTURES.water = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const b = noise(220, 25); cx.fillStyle = rgb(20, (b*0.5)|0, b); cx.fillRect(x, y, 1, 1);
    }
  });
  // Kömür cevheri
  TEXTURES.coal_ore = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const isC = ((x%4===0 && y%3===0) || (x===6&&y===7));
      cx.fillStyle = isC ? '#222' : rgb(noise(128, 20), noise(128, 20), noise(128, 20));
      cx.fillRect(x, y, 1, 1);
    }
  });
  // Demir cevheri
  TEXTURES.iron_ore = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const isI = ((x===3&&y===5) || (x===10&&y===11) || (x===7&&y===8));
      cx.fillStyle = isI ? '#d4a373' : rgb(noise(128, 20), noise(128, 20), noise(128, 20));
      cx.fillRect(x, y, 1, 1);
    }
  });
  // Altın cevheri
  TEXTURES.gold_ore = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const isG = ((x===4&&y===4) || (x===9&&y===10) || (x===5&&y===12));
      cx.fillStyle = isG ? '#ffd700' : rgb(noise(128, 20), noise(128, 20), noise(128, 20));
      cx.fillRect(x, y, 1, 1);
    }
  });
  // Kitaplık (Bookshelf)
  TEXTURES.bookshelf = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const isShelf = (y === 0 || y === 7 || y === 8 || y === 15);
      if(isShelf) cx.fillStyle = '#8b5a2b';
      else {
        const colors = ['#b22222','#1e90ff','#2e8b57','#ffd700','#8b008b'];
        cx.fillStyle = colors[(x * 3 + (y > 7 ? 2 : 0)) % colors.length];
      }
      cx.fillRect(x, y, 1, 1);
    }
  });
  // Işıktaşı (Glowstone)
  TEXTURES.glowstone = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const yl = noise(225, 30); cx.fillStyle = rgb(yl, (yl*0.85)|0, noise(80, 40)); cx.fillRect(x, y, 1, 1);
    }
  });
  // Obsidyen
  TEXTURES.obsidian = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const p = noise(30, 15); cx.fillStyle = rgb(p, (p*0.7)|0, p + 18); cx.fillRect(x, y, 1, 1);
    }
  });
  // Taş Tuğla
  TEXTURES.stone_brick = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const mortar = (y % 8 === 0 || (y < 8 && x === 8) || (y >= 8 && x === 0));
      const gr = mortar ? noise(70, 10) : noise(130, 15);
      cx.fillStyle = rgb(gr, gr, gr); cx.fillRect(x, y, 1, 1);
    }
  });
  // Yünler
  TEXTURES.wool_white = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const w = noise(235, 15); cx.fillStyle = rgb(w, w, w); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.wool_red = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const r = noise(200, 20); cx.fillStyle = rgb(r, 25, 25); cx.fillRect(x, y, 1, 1);
    }
  });
  TEXTURES.wool_blue = makePixelTexture(cx => {
    for(let y=0; y<16; y++) for(let x=0; x<16; x++){
      const b = noise(210, 20); cx.fillStyle = rgb(25, 45, b); cx.fillRect(x, y, 1, 1);
    }
  });
}
initTextures();

/* ================= 20+ BLOK TANIMLARI ================= */
const BLOCKS = {
  1: { id: 1, name: 'Çim', icon: TEXTURES.grass_side.canvas, getMats: () => [
    new THREE.MeshLambertMaterial({map: TEXTURES.grass_side.tex}),
    new THREE.MeshLambertMaterial({map: TEXTURES.grass_side.tex}),
    new THREE.MeshLambertMaterial({map: TEXTURES.grass_top.tex}),
    new THREE.MeshLambertMaterial({map: TEXTURES.dirt.tex}),
    new THREE.MeshLambertMaterial({map: TEXTURES.grass_side.tex}),
    new THREE.MeshLambertMaterial({map: TEXTURES.grass_side.tex}),
  ]},
  2: { id: 2, name: 'Toprak', icon: TEXTURES.dirt.canvas, getMats: () => new THREE.MeshLambertMaterial({map: TEXTURES.dirt.tex}) },
  3: { id: 3, name: 'Taş', icon: TEXTURES.stone.canvas, getMats: () => new THREE.MeshLambertMaterial({map: TEXTURES.stone.tex}) },

/* ================= RASTGELE HARİTA TOHUMU VE DENİZ ================= */
let SEED = Math.floor(Math.random() * 900000) + 100000;
const urlParams = new URLSearchParams(window.location.search);
if(urlParams.get('seed')) SEED = parseInt(urlParams.get('seed'));
$('seedVal').textContent = SEED;

const SEA_LEVEL = 7; // Deniz seviyesi

function hash2D(x, z){
  const n = Math.sin(x * 12.9898 + z * 78.233 + (SEED % 9999) * 0.137) * 43758.5453;
  return n - Math.floor(n);
}
function smoothNoise(x, z){
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x - ix, fz = z - iz;
  const sx = fx * fx * (3 - 2 * fx);
  const sz = fz * fz * (3 - 2 * fz);
  const v00 = hash2D(ix, iz), v10 = hash2D(ix + 1, iz);
  const v01 = hash2D(ix, iz + 1), v11 = hash2D(ix + 1, iz + 1);
  return v00 + sx * (v10 - v00) + sz * (v01 + sx * (v11 - v01) - (v00 + sx * (v10 - v00)));
}
function terrainHeight(gx, gz){
  const n1 = smoothNoise(gx * 0.025, gz * 0.025) * 11;
  const n2 = smoothNoise(gx * 0.07, gz * 0.07) * 4.5;
  const n3 = smoothNoise(gx * 0.18, gz * 0.18) * 1.5;
  return Math.floor(7 + n1 + n2 + n3);
}

/* ================= SONSUZ CHUNK VE KÖY SİSTEMİ ================= */
const CHUNK_SIZE = 16, CHUNK_Y = 32;
const RENDER_DIST = 2;
const chunks = new Map();
const chunkGroup = new THREE.Group();

function buildVillageHouse(blocks, hx, hz, baseY){
  // 5x5 Köy Evi
  for(let x = 0; x < 5; x++){
    for(let z = 0; z < 5; z++){
      const isCorner = (x === 0 || x === 4) && (z === 0 || z === 4);
      const isWall = (x === 0 || x === 4 || z === 0 || z === 4);
      // Zemin
      blocks[hx + x + (hz + z) * CHUNK_SIZE + baseY * CHUNK_SIZE * CHUNK_SIZE] = 4; // Kırıktaş zemin
      // Duvarlar ve Köşeler (4 blok yüksek)
      for(let y = 1; y <= 3; y++){
        const idx = hx + x + (hz + z) * CHUNK_SIZE + (baseY + y) * CHUNK_SIZE * CHUNK_SIZE;
        if(isCorner){
          blocks[idx] = 5; // Odun sütun
        } else if(isWall){
          if(x === 2 && z === 0 && y === 1){
            blocks[idx] = 0; // Kapı boşluğu
          } else if(y === 2 && ((x === 2 && z === 4) || (z === 2 && (x === 0 || x === 4)))){
            blocks[idx] = 9; // Cam pencere
          } else {
            blocks[idx] = 6; // Tahta duvar
          }
        }
      }
      // Çatı
      blocks[hx + x + (hz + z) * CHUNK_SIZE + (baseY + 4) * CHUNK_SIZE * CHUNK_SIZE] = 6; // Tahta çatı
    }
  }
}

function createChunk(cx, cz){
  const key = `${cx},${cz}`;
  const blocks = new Uint8Array(CHUNK_SIZE * CHUNK_SIZE * CHUNK_Y);
  const ch = { cx, cz, key, blocks, group: new THREE.Group(), meshBuilt: false };
  chunkGroup.add(ch.group);

  // Köy var mı kontrolü (Düzlük chunklarda %22 şans)
  const isVillageChunk = (hash2D(cx * 17.3, cz * 19.7) > 0.78);
  let houseBuilt = false;

  for(let lx = 0; lx < CHUNK_SIZE; lx++){
    for(let lz = 0; lz < CHUNK_SIZE; lz++){
      const gx = cx * CHUNK_SIZE + lx;
      const gz = cz * CHUNK_SIZE + lz;
      const h = Math.max(2, Math.min(CHUNK_Y - 7, terrainHeight(gx, gz)));

      for(let y = 0; y <= h; y++){
        const idx = lx + lz * CHUNK_SIZE + y * CHUNK_SIZE * CHUNK_SIZE;
        if(y === 0){
          blocks[idx] = 19; // En dip obsidyen
        } else if(y === h){
          blocks[idx] = (h <= SEA_LEVEL) ? 8 : 1; // Sahilde kum, karada çim
        } else if(y >= h - 2){
          blocks[idx] = (h <= SEA_LEVEL) ? 8 : 2;
        } else {
          // Madenler
          const oreRand = hash2D(gx * 3.7 + y * 1.3, gz * 2.9 + y * 7.1);
          if(y <= 4 && oreRand > 0.94) blocks[idx] = 11; // Elmas
          else if(y <= 8 && oreRand > 0.92) blocks[idx] = 16; // Altın
          else if(oreRand > 0.88) blocks[idx] = 15; // Demir
          else if(oreRand > 0.82) blocks[idx] = 14; // Kömür
          else blocks[idx] = 3; // Taş
        }
      }

      // Deniz suyu doldur (Deniz seviyesinin altındaki boşluklara)
      if(h < SEA_LEVEL){
        for(let wy = h + 1; wy <= SEA_LEVEL; wy++){
          const idx = lx + lz * CHUNK_SIZE + wy * CHUNK_SIZE * CHUNK_SIZE;
          blocks[idx] = 13; // Su
        }
      }

      // Ağaçlar (Sadece karada ve köy evi olmayan yerlerde)
      const treeRand = hash2D(gx * 5.1, gz * 7.7);
      if(!isVillageChunk && h > SEA_LEVEL + 1 && treeRand > 0.965 && lx >= 2 && lx <= 13 && lz >= 2 && lz <= 13){
        const trunkH = 4 + (treeRand > 0.985 ? 1 : 0);
        for(let ty = 1; ty <= trunkH; ty++){
          if(h + ty < CHUNK_Y) blocks[lx + lz * CHUNK_SIZE + (h + ty) * CHUNK_SIZE * CHUNK_SIZE] = 5;
        }
        const topY = h + trunkH;
        for(let ox = -2; ox <= 2; ox++) for(let oz = -2; oz <= 2; oz++) for(let oy = topY - 1; oy <= topY; oy++){
          if(Math.abs(ox) === 2 && Math.abs(oz) === 2 && hash2D(gx + ox, gz + oz) < 0.45) continue;
          const nlx = lx + ox, nlz = lz + oz;
          if(nlx >= 0 && nlx < CHUNK_SIZE && nlz >= 0 && nlz < CHUNK_SIZE && oy < CHUNK_Y){
            const lidx = nlx + nlz * CHUNK_SIZE + oy * CHUNK_SIZE * CHUNK_SIZE;
            if(blocks[lidx] === 0) blocks[lidx] = 7;
          }
        }
        if(topY + 1 < CHUNK_Y){
          const lidx = lx + lz * CHUNK_SIZE + (topY + 1) * CHUNK_SIZE * CHUNK_SIZE;
          if(blocks[lidx] === 0) blocks[lidx] = 7;
        }
      }
    }
  }

  // Köy Evi Yerleştir
  if(isVillageChunk && !houseBuilt){
    const centerH = terrainHeight(cx * CHUNK_SIZE + 5, cz * CHUNK_SIZE + 5);
    if(centerH > SEA_LEVEL){
      buildVillageHouse(blocks, 5, 5, centerH);
      houseBuilt = true;
      // Köye bir köylü spawn et
      spawnMob('villager', cx * CHUNK_SIZE + 7.5, centerH + 1, cz * CHUNK_SIZE + 7.5);
    }
  }

  // Doğal hayvan spawn şansı
  if(hash2D(cx * 11.1, cz * 13.3) > 0.75){
    const sh = terrainHeight(cx * CHUNK_SIZE + 8, cz * CHUNK_SIZE + 8);
    if(sh > SEA_LEVEL){
      spawnMob(Math.random() < 0.5 ? 'sheep' : 'cow', cx * CHUNK_SIZE + 8, sh + 1, cz * CHUNK_SIZE + 8);
    }
  }

  return ch;
}

function getChunk(cx, cz){
  const key = `${cx},${cz}`;
  let ch = chunks.get(key);
  if(!ch){
    ch = createChunk(cx, cz);
    chunks.set(key, ch);
  }
  return ch;
}

function getBlock(x, y, z){
  if(y < 0 || y >= CHUNK_Y) return 0;
  const cx = Math.floor(x / CHUNK_SIZE);
  const cz = Math.floor(z / CHUNK_SIZE);
  const ch = chunks.get(`${cx},${cz}`);
  if(!ch) return 0;
  const lx = ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
  const lz = ((z % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
  return ch.blocks[lx + lz * CHUNK_SIZE + y * CHUNK_SIZE * CHUNK_SIZE];
}

const sharedBoxGeo = new THREE.BoxGeometry(1, 1, 1);
const dummy = new THREE.Object3D();

function isTransparentBlock(id){
  return id === 0 || id === 9 || id === 13;
}

function rebuildChunkMesh(ch){
  while(ch.group.children.length > 0){
    const m = ch.group.children[0];
    ch.group.remove(m);
    if(m.geometry) m.geometry.dispose();
  }

  const counts = {};
  for(let lx = 0; lx < CHUNK_SIZE; lx++){
    for(let lz = 0; lz < CHUNK_SIZE; lz++){
      const gx = ch.cx * CHUNK_SIZE + lx;
      const gz = ch.cz * CHUNK_SIZE + lz;
      for(let y = 0; y < CHUNK_Y; y++){
        const id = ch.blocks[lx + lz * CHUNK_SIZE + y * CHUNK_SIZE * CHUNK_SIZE];
        if(id > 0 && BLOCKS[id]){
          const exposed = (
            isTransparentBlock(getBlock(gx+1, y, gz)) || isTransparentBlock(getBlock(gx-1, y, gz)) ||
            isTransparentBlock(getBlock(gx, y+1, gz)) || isTransparentBlock(getBlock(gx, y-1, gz)) ||
            isTransparentBlock(getBlock(gx, y, gz+1)) || isTransparentBlock(getBlock(gx, y, gz-1))
          );
          if(exposed) counts[id] = (counts[id] || 0) + 1;
        }
      }
    }
  }

  const meshes = {}, indices = {};
  for(const id in counts){
    const im = new THREE.InstancedMesh(sharedBoxGeo, BLOCKS[id].mat, counts[id]);
    ch.group.add(im);
    meshes[id] = im;
    indices[id] = 0;
  }

  for(let lx = 0; lx < CHUNK_SIZE; lx++){
    for(let lz = 0; lz < CHUNK_SIZE; lz++){
      const gx = ch.cx * CHUNK_SIZE + lx;
      const gz = ch.cz * CHUNK_SIZE + lz;
      for(let y = 0; y < CHUNK_Y; y++){
        const id = ch.blocks[lx + lz * CHUNK_SIZE + y * CHUNK_SIZE * CHUNK_SIZE];
        if(id > 0 && meshes[id]){
          const exposed = (
            isTransparentBlock(getBlock(gx+1, y, gz)) || isTransparentBlock(getBlock(gx-1, y, gz)) ||
            isTransparentBlock(getBlock(gx, y+1, gz)) || isTransparentBlock(getBlock(gx, y-1, gz)) ||
            isTransparentBlock(getBlock(gx, y, gz+1)) || isTransparentBlock(getBlock(gx, y, gz-1))
          );
          if(exposed){
            dummy.position.set(gx + 0.5, y + 0.5, gz + 0.5);
            dummy.updateMatrix();
            meshes[id].setMatrixAt(indices[id]++, dummy.matrix);
          }
        }
      }
    }
  }

  for(const id in meshes) meshes[id].instanceMatrix.needsUpdate = true;
  ch.meshBuilt = true;
}

function setBlock(x, y, z, id){
  if(y < 0 || y >= CHUNK_Y) return;
  const cx = Math.floor(x / CHUNK_SIZE);
  const cz = Math.floor(z / CHUNK_SIZE);
  const ch = getChunk(cx, cz);
  const lx = ((x % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
  const lz = ((z % CHUNK_SIZE) + CHUNK_SIZE) % CHUNK_SIZE;
  ch.blocks[lx + lz * CHUNK_SIZE + y * CHUNK_SIZE * CHUNK_SIZE] = id;
  rebuildChunkMesh(ch);

  if(lx === 0) { const nb = chunks.get(`${cx-1},${cz}`); if(nb) rebuildChunkMesh(nb); }
  if(lx === CHUNK_SIZE-1) { const nb = chunks.get(`${cx+1},${cz}`); if(nb) rebuildChunkMesh(nb); }
  if(lz === 0) { const nb = chunks.get(`${cx},${cz-1}`); if(nb) rebuildChunkMesh(nb); }
  if(lz === CHUNK_SIZE-1) { const nb = chunks.get(`${cx},${cz+1}`); if(nb) rebuildChunkMesh(nb); }
}

function updateChunks(){
  const pcx = Math.floor(player.x / CHUNK_SIZE);
  const pcz = Math.floor(player.z / CHUNK_SIZE);
  $('chunkVal').textContent = `${pcx}, ${pcz}`;

  for(let dx = -RENDER_DIST; dx <= RENDER_DIST; dx++){
    for(let dz = -RENDER_DIST; dz <= RENDER_DIST; dz++){
      const cx = pcx + dx, cz = pcz + dz;
      const ch = getChunk(cx, cz);
      if(!ch.meshBuilt) rebuildChunkMesh(ch);
      ch.group.visible = true;
    }
  }

  for(const [key, ch] of chunks.entries()){
    const dist = Math.max(Math.abs(ch.cx - pcx), Math.abs(ch.cz - pcz));
    if(dist > RENDER_DIST + 1) ch.group.visible = false;
  }
}

/* ================= CANLILAR VE YARATIKLAR (MOBS) ================= */
const mobs = [];
const mobGroup = new THREE.Group();

function createMobMesh(type){
  const g = new THREE.Group();
  if(type === 'villager'){
    // Köylü: Kafa + Burun + Kahverengi cüppe
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({color: 0xdca882}));
    head.position.y = 1.35;
    const nose = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.22, 0.14), new THREE.MeshLambertMaterial({color: 0xc8926d}));
    nose.position.set(0, 1.28, 0.3);
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.55, 0.8, 0.4), new THREE.MeshLambertMaterial({color: 0x6e4324}));
    body.position.y = 0.7;
    const legs = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.35, 0.35), new THREE.MeshLambertMaterial({color: 0x3d2514}));
    legs.position.y = 0.175;
    g.add(head, nose, body, legs);
  } else if(type === 'zombie'){
    // Zombi: Yeşil kafa + Mavi üst + Kollar öne uzanmış
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({color: 0x488a38}));
    head.position.y = 1.35;
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.7, 0.3), new THREE.MeshLambertMaterial({color: 0x2288aa}));
    body.position.y = 0.75;
    const arms = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.18, 0.6), new THREE.MeshLambertMaterial({color: 0x2288aa}));
    arms.position.set(0, 0.95, 0.3);
    const legs = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.45, 0.3), new THREE.MeshLambertMaterial({color: 0x2c3558}));
    legs.position.y = 0.225;
    g.add(head, body, arms, legs);
  } else if(type === 'sheep' || type === 'cow'){
    // Hayvan: 4 ayaklı gövde
    const color = (type === 'sheep') ? 0xf0f0f0 : 0x7a431d;
    const body = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.55, 0.9), new THREE.MeshLambertMaterial({color}));
    body.position.y = 0.65;
    const head = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.35, 0.4), new THREE.MeshLambertMaterial({color: (type==='sheep'?0xedd5be:0x4d2810)}));
    head.position.set(0, 0.95, 0.55);
    for(let lx of [-0.22, 0.22]) for(let lz of [-0.3, 0.3]){
      const leg = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.4, 0.18), new THREE.MeshLambertMaterial({color: 0xd8c2aa}));
      leg.position.set(lx, 0.2, lz);
      g.add(leg);
    }
    g.add(body, head);
  }
  return g;
}

function spawnMob(type, x, y, z){
  if(mobs.length >= 24) return; // Performans sınırı
  const mesh = createMobMesh(type);
  mesh.position.set(x, y, z);
  mobGroup.add(mesh);
  mobs.push({
    type, mesh, x, y, z, vx: 0, vz: 0,
    timer: Math.random() * 3,
    yaw: Math.random() * Math.PI * 2
  });
}

function updateMobs(dt, isNight){
  // Gece olunca yakında zombi doğur
  if(isNight && Math.random() < 0.008 && mobs.filter(m => m.type === 'zombie').length < 6){
    const angle = Math.random() * Math.PI * 2;
    const dist = 14 + Math.random() * 10;
    const zx = player.x + Math.cos(angle) * dist;
    const zz = player.z + Math.sin(angle) * dist;
    const zy = terrainHeight(Math.floor(zx), Math.floor(zz)) + 1;
    if(zy > SEA_LEVEL) spawnMob('zombie', zx, zy, zz);
  }

  for(let i = mobs.length - 1; i >= 0; i--){
    const m = mobs[i];
    m.timer -= dt;

    if(m.type === 'zombie' && isNight){
      // Zombi oyuncuyu takip eder
      const dx = player.x - m.x, dz = player.z - m.z;
      const d = Math.hypot(dx, dz);
      if(d < 22 && d > 1.2){
        m.yaw = Math.atan2(dx, dz);
        m.vx = (dx / d) * 2.6;
        m.vz = (dz / d) * 2.6;
      }
    } else if(m.timer <= 0){
      m.timer = 2 + Math.random() * 4;
      if(Math.random() < 0.6){
        m.yaw = Math.random() * Math.PI * 2;
        m.vx = Math.sin(m.yaw) * 1.2;
        m.vz = Math.cos(m.yaw) * 1.2;
        if(m.type === 'villager' && Math.random() < 0.3) playSound('villager');
      } else {
        m.vx = 0; m.vz = 0;
      }
    }

    // Hareket ve zemin takibi
    m.x += m.vx * dt;
    m.z += m.vz * dt;
    const gh = terrainHeight(Math.floor(m.x), Math.floor(m.z));
    m.y = Math.max(gh + 1, SEA_LEVEL);
    m.mesh.position.set(m.x, m.y, m.z);
    m.mesh.rotation.y = m.yaw;

    // Uzaktaki mobları temizle
    if(Math.hypot(m.x - player.x, m.z - player.z) > 60){
      mobGroup.remove(m.mesh);
      mobs.splice(i, 1);
    }
  }
}

scene.add(chunkGroup);
scene.add(mobGroup);

const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 120);
const renderer = new THREE.WebGLRenderer({canvas: $('c'), antialias: false, powerPreference: 'high-performance'});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));

const ambLight = new THREE.AmbientLight(0xffffff, 0.65);
scene.add(ambLight);

const sunLight = new THREE.DirectionalLight(0xffffff, 0.75);
sunLight.position.set(20, 40, 20);
scene.add(sunLight);

const sunGeo = new THREE.PlaneGeometry(8, 8);
const sunMat = new THREE.MeshBasicMaterial({color: 0xffff88, side: THREE.DoubleSide});
const sunMesh = new THREE.Mesh(sunGeo, sunMat);
scene.add(sunMesh);

const boxGeo = new THREE.BoxGeometry(1.005, 1.005, 1.005);
const wireMat = new THREE.MeshBasicMaterial({color: 0x000000, wireframe: true, wireframeLinewidth: 2});
const targetBox = new THREE.Mesh(boxGeo, wireMat);
targetBox.visible = false;
scene.add(targetBox);

/* ================= OYUNCU VE FİZİK ================= */
const player = {
  x: 8.5, y: 20.0, z: 8.5,
  vx: 0, vy: 0, vz: 0,
  pitch: 0, yaw: 0,
  onGround: false,
  radius: 0.3,
  height: 1.7
};

function initPlayerPosition(){
  updateChunks();
  const sh = terrainHeight(8, 8);
  player.y = Math.max(sh, SEA_LEVEL) + 2.5;
}
initPlayerPosition();

function collide(px, py, pz){
  const r = player.radius;
  const minX = Math.floor(px - r), maxX = Math.floor(px + r);
  const minZ = Math.floor(pz - r), maxZ = Math.floor(pz + r);
  const minY = Math.floor(py), maxY = Math.floor(py + player.height);

  for(let x = minX; x <= maxX; x++){
    for(let z = minZ; z <= maxZ; z++){
      for(let y = minY; y <= maxY; y++){
        const b = getBlock(x, y, z);
        if(b > 0 && b !== 13) return true; // Su içinden geçilebilir
      }
    }
  }
  return false;
}

/* ================= KONTROLLER ================= */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if(e.code >= 'Digit1' && e.code <= 'Digit9'){
    selectSlot(parseInt(e.code.replace('Digit','')) - 1);
  }
  if(e.code === 'KeyX'){
    toggleInventory();
  }
  if(e.code === 'KeyM'){
    toggleGameMode();
  }
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let isLocked = false;
$('c').addEventListener('click', () => {
  if(!isLocked && !isTouchDevice && $('invModal').style.display !== 'flex'){
    $('c').requestPointerLock();
  }
});
document.addEventListener('pointerlockchange', () => {
  isLocked = document.pointerLockElement === $('c');
});
document.addEventListener('mousemove', e => {
  if(!isLocked || $('invModal').style.display === 'flex') return;
  player.yaw -= e.movementX * 0.0024;
  player.pitch -= e.movementY * 0.0024;
  player.pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, player.pitch));
});

window.addEventListener('mousedown', e => {
  if(!isLocked || $('invModal').style.display === 'flex') return;
  if(e.button === 0) mineTarget();
  else if(e.button === 2) placeTarget();
});
window.addEventListener('contextmenu', e => e.preventDefault());

let isTouchDevice = false;
let touchLookId = null, lastTouchX = 0, lastTouchY = 0;

window.addEventListener('touchstart', e => {
  isTouchDevice = true;
  for(let i=0; i<e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    if(t.clientX > window.innerWidth * 0.4 && touchLookId === null){
      touchLookId = t.identifier;
      lastTouchX = t.clientX;
      lastTouchY = t.clientY;
    }
  }
}, {passive: false});

window.addEventListener('touchmove', e => {
  for(let i=0; i<e.changedTouches.length; i++){
    const t = e.changedTouches[i];
    if(t.identifier === touchLookId){
      const dx = t.clientX - lastTouchX, dy = t.clientY - lastTouchY;
      player.yaw -= dx * 0.005;
      player.pitch -= dy * 0.005;
      player.pitch = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, player.pitch));
      lastTouchX = t.clientX;
      lastTouchY = t.clientY;
    }
  }
}, {passive: false});

window.addEventListener('touchend', e => {
  for(let i=0; i<e.changedTouches.length; i++){
    if(e.changedTouches[i].identifier === touchLookId) touchLookId = null;
  }
});

function bindTouchKey(id, code){
  const el = $(id);
  el.addEventListener('touchstart', e => { e.preventDefault(); keys[code] = true; });
  el.addEventListener('touchend', e => { e.preventDefault(); keys[code] = false; });
}
bindTouchKey('btnUp', 'KeyW');
bindTouchKey('btnDown', 'KeyS');
bindTouchKey('btnLeft', 'KeyA');
bindTouchKey('btnRight', 'KeyD');
bindTouchKey('btnJump', 'Space');

$('btnMine').addEventListener('touchstart', e => { e.preventDefault(); mineTarget(); });
$('btnPlace').addEventListener('touchstart', e => { e.preventDefault(); placeTarget(); });

/* ================= HOTBAR VE GENİŞ ENVANTER ================= */
const hotbarSlots = [1, 2, 3, 4, 5, 6, 7, 8, 9];
let activeSlotIdx = 0;

function renderHotbar(){
  const hb = $('hotbar');
  hb.innerHTML = '';
  hotbarSlots.forEach((id, idx) => {
    const s = document.createElement('div');
    s.className = 'slot' + (idx === activeSlotIdx ? ' active' : '');
    const cv = BLOCKS[id].icon;
    s.appendChild(cv.cloneNode ? cv.cloneNode(true) : cv);
    const n = document.createElement('span');
    n.className = 'num';
    n.textContent = idx + 1;
    s.appendChild(n);
    s.onclick = () => selectSlot(idx);
    hb.appendChild(s);
  });
  $('blockName').textContent = BLOCKS[hotbarSlots[activeSlotIdx]].name;
}
function selectSlot(idx){
  activeSlotIdx = idx;
  renderHotbar();
  playSound('place');
}
window.addEventListener('wheel', e => {
  if(e.deltaY > 0) activeSlotIdx = (activeSlotIdx + 1) % hotbarSlots.length;
  else activeSlotIdx = (activeSlotIdx - 1 + hotbarSlots.length) % hotbarSlots.length;
  renderHotbar();
});
renderHotbar();

// Geniş Envanter Ekranı
function toggleInventory(force){
  const modal = $('invModal');
  const show = (force !== undefined) ? force : (modal.style.display !== 'flex');
  modal.style.display = show ? 'flex' : 'none';
  if(show){
    document.exitPointerLock?.();
    renderInventoryGrid();
  }
}
$('invToggleBtn').onclick = () => toggleInventory();

function renderInventoryGrid(){
  const grid = $('invGrid');
  grid.innerHTML = '';
  for(const id in BLOCKS){
    const b = BLOCKS[id];
    const item = document.createElement('div');
    item.className = 'invItem';
    const cv = b.icon.cloneNode ? b.icon.cloneNode(true) : b.icon;
    item.appendChild(cv);
    const label = document.createElement('span');
    label.textContent = b.name;
    item.appendChild(label);
    item.onclick = () => {
      hotbarSlots[activeSlotIdx] = parseInt(id);
      renderHotbar();
      toast(`${b.name} seçildi! (Slot ${activeSlotIdx + 1})`);
      playSound('place');
      toggleInventory(false);
    };
    grid.appendChild(item);
  }
}

/* ================= RAYCASTING ================= */
let targetInfo = null;

function updateRaycast(){
  const maxD = (gameMode === 'creative') ? 8.0 : 5.5, step = 0.05;
  const dir = new THREE.Vector3(
    -Math.sin(player.yaw) * Math.cos(player.pitch),
    Math.sin(player.pitch),
    -Math.cos(player.yaw) * Math.cos(player.pitch)
  ).normalize();

  let prevX = Math.floor(player.x), prevY = Math.floor(player.y + player.height * 0.85), prevZ = Math.floor(player.z);
  targetInfo = null;

  for(let d = 0; d < maxD; d += step){
    const cx = player.x + dir.x * d;
    const cy = (player.y + player.height * 0.85) + dir.y * d;
    const cz = player.z + dir.z * d;

    const bx = Math.floor(cx), by = Math.floor(cy), bz = Math.floor(cz);
    if(by < 0 || by >= CHUNK_Y) continue;

    const b = getBlock(bx, by, bz);
    if(b > 0 && b !== 13){ // Su harici blokları seç
      targetInfo = {
        hit: { x: bx, y: by, z: bz },
        place: { x: prevX, y: prevY, z: prevZ }
      };
      targetBox.position.set(bx + 0.5, by + 0.5, bz + 0.5);
      targetBox.visible = true;
      return;
    }
    prevX = bx; prevY = by; prevZ = bz;
  }
  targetBox.visible = false;
}

function mineTarget(){
  if(!targetInfo) return;
  const { x, y, z } = targetInfo.hit;
  setBlock(x, y, z, 0);
  playSound('break');
}

function placeTarget(){
  if(!targetInfo) return;
  const { x, y, z } = targetInfo.place;
  const minX = player.x - player.radius, maxX = player.x + player.radius;
  const minZ = player.z - player.radius, maxZ = player.z + player.radius;
  const minY = player.y, maxY = player.y + player.height;
  if(x >= Math.floor(minX) && x <= Math.floor(maxX) &&
     z >= Math.floor(minZ) && z <= Math.floor(maxZ) &&
     y >= Math.floor(minY) && y <= Math.floor(maxY)){
    return;
  }
  const id = hotbarSlots[activeSlotIdx];
  setBlock(x, y, z, id);
  playSound('place');
}

/* ================= OYUN DÖNGÜSÜ ================= */
let lastT = performance.now(), frameCount = 0, lastFpsT = performance.now();
let dayTime = 0, chunkTimer = 0;

function animate(now){
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastT) / 1000, 0.1);
  lastT = now;

  frameCount++;
  if(now - lastFpsT >= 500){
    $('fps').textContent = Math.round((frameCount * 1000) / (now - lastFpsT));
    frameCount = 0;
    lastFpsT = now;
  }

  chunkTimer += dt;
  if(chunkTimer > 0.3){
    chunkTimer = 0;
    updateChunks();
  }

  // Gün / Gece döngüsü
  dayTime += dt * 0.04;
  const sunAngle = dayTime;
  sunMesh.position.set(player.x + Math.cos(sunAngle) * 45, player.y + Math.sin(sunAngle) * 45, player.z + 10);
  sunMesh.lookAt(player.x, player.y, player.z);
  sunLight.position.copy(sunMesh.position);

  const sunH = Math.sin(sunAngle);
  const isNight = (sunH < -0.2);
  if(sunH > 0.2){
    scene.background.setHex(0x78a7ff);
    scene.fog.color.setHex(0x78a7ff);
    ambLight.intensity = 0.65;
  } else if(sunH > -0.2){
    scene.background.setHex(0xd97736);
    scene.fog.color.setHex(0xd97736);
    ambLight.intensity = 0.45;
  } else {
    scene.background.setHex(0x0a0e1a);
    scene.fog.color.setHex(0x0a0e1a);
    ambLight.intensity = 0.25;
  }

  // Canlıları güncelle
  updateMobs(dt, isNight);

  // Hareket
  const forward = (keys['KeyW'] ? 1 : 0) - (keys['KeyS'] ? 1 : 0);
  const strafe = (keys['KeyD'] ? 1 : 0) - (keys['KeyA'] ? 1 : 0);
  const speed = (gameMode === 'creative') ? 8.5 : 5.2;

  let moveX = 0, moveZ = 0;
  if(forward !== 0 || strafe !== 0){
    const cosY = Math.cos(player.yaw), sinY = Math.sin(player.yaw);
    const fx = -sinY * forward, fz = -cosY * forward;
    const sx = cosY * strafe, sz = -sinY * strafe;
    const len = Math.hypot(fx + sx, fz + sz) || 1;
    moveX = ((fx + sx) / len) * speed;
    moveZ = ((fz + sz) / len) * speed;
  }

  // Zıplama & Yaratıcı Uçuş
  if(gameMode === 'creative'){
    if(keys['Space']) player.vy = 6.0;
    else if(keys['ShiftLeft'] || keys['KeyC']) player.vy = -6.0;
    else player.vy = 0;
  } else {
    if(keys['Space'] && player.onGround){
      player.vy = 7.5;
      player.onGround = false;
      playSound('jump');
    }
    player.vy -= 22 * dt;
  }

  // X & Z Çarpışma
  const nextX = player.x + moveX * dt;
  if(!collide(nextX, player.y, player.z)) player.x = nextX;
  const nextZ = player.z + moveZ * dt;
  if(!collide(player.x, player.y, nextZ)) player.z = nextZ;

  // Y Çarpışma
  const nextY = player.y + player.vy * dt;
  if(gameMode === 'creative'){
    player.y = nextY;
  } else {
    if(collide(player.x, nextY, player.z)){
      if(player.vy < 0){
        player.onGround = true;
        player.vy = 0;
        player.y = Math.ceil(nextY);
      } else {
        player.vy = 0;
      }
    } else {
      player.y = nextY;
      player.onGround = false;
    }
  }

  if(player.y < -10){
    const h = terrainHeight(Math.floor(player.x), Math.floor(player.z));
    player.y = Math.max(h + 3, SEA_LEVEL + 3);
    player.vy = 0;
  }

  camera.position.set(player.x, player.y + player.height * 0.85, player.z);
  camera.rotation.order = 'YXZ';
  camera.rotation.y = player.yaw;
  camera.rotation.x = player.pitch;

  $('coords').textContent = `${player.x.toFixed(1)}, ${player.y.toFixed(1)}, ${player.z.toFixed(1)}`;

  updateRaycast();
  renderer.render(scene, camera);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
